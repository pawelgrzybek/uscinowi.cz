<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uscinowi.cz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <div class="machine">
        <a class="board" id="board"></a>
        <button class="lever" id="lever" type="button" aria-label="Pokaż numer telefonu">
          <svg viewBox="0 0 50 160" aria-hidden="true">
            <!-- mount on the side of the board -->
            <rect x="0" y="112" width="36" height="36" rx="4" />
            <line class="lever__arm" x1="18" y1="130" x2="18" y2="20" />
            <circle cx="18" cy="130" r="5" />
            <circle class="lever__knob" cx="18" cy="20" r="11" />
          </svg>
        </button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
