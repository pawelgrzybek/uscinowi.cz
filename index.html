<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uscinowi.cz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Comfortaa:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button class="switch" id="switch" type="button" aria-label="Pokaż e-mail" aria-pressed="false">
      <svg viewBox="0 0 72 40" aria-hidden="true">
        <rect x="1" y="1" width="70" height="38" rx="19" />
        <g class="switch__knob"><circle cx="20" cy="20" r="13" /></g>
      </svg>
    </button>

    <main class="stage">
      <div class="machine">
        <a class="board" id="board"></a>
        <button class="lever" id="lever" type="button" aria-label="Pokaż numer telefonu">
          <svg viewBox="0 0 50 160" aria-hidden="true">
            <!-- mount on the side of the board -->
            <rect x="0" y="112" width="36" height="36" rx="4" />
            <line class="lever__arm" x1="18" y1="130" x2="18" y2="20" />
            <circle cx="18" cy="130" r="5" />
            <circle class="lever__knob" cx="18" cy="20" r="11" />
            <circle class="lever__knob-dot" cx="22.5" cy="15.5" r="3" />
          </svg>
        </button>
      </div>
      <a class="mail" id="mail" href="mailto:marcin@uscinowi.cz">marcin<span class="mail__at">@</span>uscinowi.cz</a>
    </main>

    <script src="script.js"></script>
  </body>
</html>
